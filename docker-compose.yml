services:
  ereader-bridge:
    build: .
    container_name: ereader-bridge
    restart: unless-stopped
    # Optional: join Kavita's and Audiobookshelf's Docker networks and call them by container name
    # (KAVITA_URL=http://kavita:5000, AUDIOBOOKSHELF_URL=http://audiobookshelf:80) instead of going through
    # host.docker.internal. Uncomment together with the "networks:" block at the bottom.
    # networks: [default, kavita, audiobookshelf]
    ports:
      - "2525:2525"  # SMTP in (Kavita "Send to Device")
      - "8086:8086"  # HTTP in: the web app, PUT /send/<device>/<filename>, GET /status, KOReader pull
    volumes:
      - ./data:/data
      # Kavita's library at the SAME path Kavita sees inside its own container: paper -> EPUB sync reads the
      # EPUB paths Kavita reports, and books dropped on the web page are filed into it (needs read-write;
      # add ":ro" if you don't use that). More libraries: mount each and list them in LIBRARY_DIRS.
      - /path/to/your/books:/books
      # Audiobook <-> EPUB sync only: mount the audiobooks at the SAME paths Audiobookshelf sees inside its
      # container (the bridge cuts clips from the file paths Audiobookshelf reports). Remove if unused.
      - /path/to/your/audiobooks:/audiobooks:ro
    env_file:
      - path: .env        # copy .env.example to .env (KAVITA_API_KEY, NOTIFY_URL); not in git
        required: false
    environment:
      - TZ=UTC
      - SCAN_SUBNET=192.168.1.0/24   # where BOOX devices are searched for when their IP changes
      - KAVITA_URL=http://host.docker.internal:5000   # paper -> EPUB sync; leave KAVITA_API_KEY empty to disable
      - LIBRARY_DIRS=/books   # where dropped EPUBs can go, e.g. /books,/kidsbooks
      # Audiobook <-> EPUB sync (docs/audio-sync.md); leave AUDIOBOOKSHELF_TOKEN in .env empty to disable.
      # whisper-server runs on the host (scripts/install-whisper-server.sh).
      - AUDIOBOOKSHELF_URL=http://host.docker.internal:13378
      - WHISPER_URL=http://host.docker.internal:8178
      - NOTIFY_EVENTS=delivered,pulled
      # Device name = SMTP local-part (<name>@anything) and HTTP path segment.
      # boox: "host" is a first guess; the device is found again by "id" (from GET http://<boox>:8085/api/device).
      # moosnap: "host"/"alt_hosts" ARE the identity -> give the device a fixed IP.
      # Any device running KOReader can also pull its own queue with the plugin in koreader/ (VPN, hotspot...).
      # alt_hosts: other fixed addresses of the same device, e.g. its WireGuard IP when away from home.
      - 'DEVICES={"palma":   {"driver": "boox", "id": "aa:bb:cc:dd:ee:ff", "host": "192.168.1.50"},
                  "moosnap": {"driver": "moosnap", "host": "192.168.1.51", "alt_hosts": ["10.0.0.51"]}}'

# networks:
#   kavita:
#     name: kavita_default            # the network Kavita's compose project created (docker network ls)
#     external: true
#   audiobookshelf:
#     name: audiobookshelf_default
#     external: true
