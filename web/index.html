<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ereader-bridge</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e0; --ok:#1f9d55; --off:#b0b0b0; --accent:#2f6fdb; --warn:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --card:#1f1f22; --ink:#ececee; --muted:#9a9aa1; --line:#33333a; --ok:#3ecf7a; --off:#5a5a62; --accent:#6aa0ff; --warn:#fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .dev h2 { font-size:16px; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); flex:none; }
  .dot.on { background:var(--ok); }
  .dot.ko { background:var(--accent); }
  .meta { font-size:12.5px; color:var(--muted); display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  ul { list-style:none; margin:10px 0 0; padding:0; }
  li { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
  li .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .size { color:var(--muted); font-size:12px; white-space:nowrap; }
  button, select { font:inherit; font-size:12.5px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px; padding:4px 9px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.danger:hover { border-color:var(--warn); color:var(--warn); }
  h3 { font-size:15px; margin:22px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td { padding:7px 6px; border-top:1px solid var(--line); vertical-align:middle; }
  td.file { max-width:0; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st { font-size:12px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .st.delivered, .st.pulled { color:var(--ok); border-color:var(--ok); }
  .st.cancelled, .st.expired { color:var(--warn); border-color:var(--warn); }
  .empty { color:var(--muted); font-size:13px; padding-top:8px; }
  .nowrap { white-space:nowrap; }
  #msg { min-height:18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📚 ereader-bridge</h1>
    <span class="muted" id="updated"></span>
  </header>
  <div class="muted" id="msg"></div>
  <div class="grid" id="devices"></div>
  <h3>Recent history</h3>
  <div class="card"><table id="history"></table></div>
</main>
<script>
const LABELS = {};  // optional display names, e.g. { "palma2": "BOOX Palma 2" }
const STATUS = { delivered: "delivered", pulled: "pulled by device", duplicate: "already there", cancelled: "cancelled", expired: "expired", queued: "queued" };
const label = (n) => LABELS[n] || n;
const when = (iso) => iso ? iso.slice(5, 16).replace("T", " ") : "—";
const minutesAgo = (iso) => iso ? (Date.now() - new Date(iso)) / 60000 : Infinity;
// push reachable > the reader's KOReader plugin talked to us recently > offline
function presence(d) {
  if (d.online) return ["on", `reachable · ${d.host}`];
  const m = minutesAgo(d.last_contact);
  if (m <= 10) return ["ko", `KOReader seen ${m < 1 ? "just now" : Math.round(m) + " min ago"} (pulls from KOReader)`];
  const last = [d.last_seen, d.last_contact].filter(Boolean).sort().pop();
  return ["", `offline · last seen ${when(last)}`];
}
const size = (b) => b >= 1 << 20 ? (b / (1 << 20)).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : k.startsWith("on") ? (e[k] = v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return e;
};
let devices = {};

function say(text) { document.getElementById("msg").textContent = text; }

async function call(method, url) {
  const r = await fetch(url, { method });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || body.status || r.status);
  return body;
}

async function cancelJob(dev, job, file) {
  if (!confirm(`Cancel sending '${file}'?`)) return;
  try { await call("DELETE", `/jobs/${encodeURIComponent(dev)}/${job}`); say(`Cancelled: ${file}`); }
  catch (e) { say(`Cancel failed: ${e.message}`); }
  load();
}

async function resendJob(dev, job, file, to) {
  try { await call("POST", `/jobs/${encodeURIComponent(dev)}/${job}/resend?to=${encodeURIComponent(to)}`); say(`Resent: ${file} → ${label(to)}`); }
  catch (e) { say(`Resend failed: ${e.message}`); }
  load();
}

function deviceCard(name, d) {
  const plugin = d.plugin ? `${d.plugin.version} (${when(d.plugin.checked)})` : "—";
  const [dot, presenceText] = presence(d);
  const list = el("ul");
  for (const j of d.jobs) {
    list.append(el("li", {}, el("span", { class: "name", title: j.file }, j.file), el("span", { class: "size" }, size(j.size)),
      el("button", { class: "danger", onclick: () => cancelJob(name, j.job, j.file) }, "Cancel")));
  }
  return el("div", { class: "card dev" },
    el("h2", {}, el("span", { class: "dot " + dot }), label(name)),
    el("div", { class: "meta" },
      el("span", {}, "Status"), el("span", {}, presenceText),
      el("span", {}, "Plugin"), el("span", {}, plugin),
      el("span", {}, "Queued"), el("span", {}, `${d.jobs.length}`)),
    d.jobs.length ? list : el("div", { class: "empty" }, "Nothing queued"));
}

function historyRows(history) {
  const kept = {};
  for (const [n, d] of Object.entries(devices)) for (const s of d.sent) kept[n + "/" + s.job] = true;
  const t = document.getElementById("history");
  t.replaceChildren();
  if (!history.length) { t.append(el("tr", {}, el("td", { class: "empty" }, "No history yet"))); return; }
  for (const h of history.slice(0, 50)) {
    const actions = el("td", { class: "nowrap" });
    if (kept[h.device + "/" + h.job]) {
      const to = el("select", {}, ...Object.keys(devices).map((n) => { const o = el("option", { value: n }, label(n)); if (n === h.device) o.selected = true; return o; }));
      actions.append(to, " ", el("button", { onclick: () => resendJob(h.device, h.job, h.file, to.value) }, "Resend"));
    }
    t.append(el("tr", {},
      el("td", { class: "nowrap muted" }, h.at.slice(5, 16).replace("T", " ")),
      el("td", { class: "file", title: h.file }, h.file),
      el("td", { class: "nowrap" }, label(h.device)),
      el("td", {}, el("span", { class: "st " + h.status }, STATUS[h.status] || h.status)),
      actions));
  }
}

async function load() {
  try {
    const s = await call("GET", "/status");
    devices = s.devices;
    document.getElementById("devices").replaceChildren(...Object.entries(devices).map(([n, d]) => deviceCard(n, d)));
    historyRows(s.history);
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) { say(`Cannot reach the bridge: ${e.message}`); }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
